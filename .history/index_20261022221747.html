<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientifico Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- = the html starts here = -->

    <h1>Sciency Flashcards</h1>
    <p class="hint">Click a card to flip it.</p>

    <div class="cards">

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the chemical formula for water?</div>
                <div class="back"><strong>H₂O</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the POWERHOUSE of the cell? Come on, you can do it!</div>
                <div class="back">It is <strong>Mitochondria</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the chemical name for W??</div>
                <div class="back">It is <strong>Tungsten</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the chemical name for Na??</div>
                <div class="back">It is <strong>Sodium</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the closest planet to the Sun?</div>
                <div class="back"><strong>Mercury</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What force pulls objects down towards the ground?</div>
                <div class="back"><strong>Gravity</strong> - Isaac Newton described how it works</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the hardest natural substance on Earth?</div>
                <div class="back"><strong>Diamond</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the medical term for a hunched back??</div>
                <div class="back"><strong>Kyphosis</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the main source of energy for the Earth?</div>
                <div class="back"><strong>The Sun</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the main gas found in the Earth's atmosphere?</div>
                <div class="back"><strong>Nitrogen</strong> - 78% of the Earth's atmosphere</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What gives the hair and the skin its colour?</div>
                <div class="back"><strong>Melanin</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the largest organ in the human body?</div>
                <div class="back"><strong>Skin</strong> - around 15% of body weight</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the smallest bone in the human body? This is a tough one, try your best.
                </div>
                <div class="back"><strong>Stapes</strong> - located in the middle ear</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the largest bone in the human body?</div>
                <div class="back"><strong>Femur</strong> - located in the thigh</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">Which tissue attaches muscles to bones??</div>
                <div class="back"><strong>Tendons</strong> - connect muscles to bones</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What's the densest element on the periodic table?</div>
                <div class="back"><strong>Osmium</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What galaxy do we live in?</div>
                <div class="back"><strong>The Milky Way</strong></div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is the largest planet in our solar system?? YOU BETTER GET THIS!!! LOL!</div>
                <div class="back"><strong>Jupiter</strong></div>
            </div>
        </label>

    </div>

    <!-- the css-->

    <style>
        body {
            background: #8affbb;
            font-family: "Comic SAans MS", cursive, sans-serif;

        }
    </style>
